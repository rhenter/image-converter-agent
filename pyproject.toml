[project]
name = "image-converter-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "agno[os]>=3.1.7",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
